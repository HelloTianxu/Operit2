name: Build Installable Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-runtime:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bison build-essential bzip2 ca-certificates curl diffutils flex gawk gzip patch pkg-config tar unzip xz-utils powershell
      - name: Fetch sources and NDK
        run: |
          for attempt in 1 2 3 4 5; do
            if pwsh -NoProfile -File tools/android-runtime/fetch_sources.ps1; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              exit 1
            fi
            echo "Source download attempt $attempt failed; retrying..."
            sleep $((attempt * 15))
          done
          bash tools/android-runtime/fetch_ndk_wsl.sh
      - name: Build Android terminal runtime
        run: |
          export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          bash tools/android-runtime/build_android_tools_wsl.sh
          bash tools/android-runtime/build_alpine_rootfs_wsl.sh
      - uses: actions/upload-artifact@v4
        with:
          name: operit2-android-runtime
          path: |
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/libbash.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_busybox.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_loader.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_proot.so
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin.sha256
          if-no-files-found: error
          retention-days: 3

  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0
      OPERIT_LIBCLANG_DIR: /usr/lib/llvm-21/lib
    steps:
      - uses: actions/checkout@v4
      - name: Download previously built Android runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/operit-runtime
          gh run download 43595775728 --repo "${{ github.repository }}" --name operit2-android-runtime --dir /tmp/operit-runtime
          cp -a /tmp/operit-runtime/. apps/flutter/app/android/app/src/main/
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install FVM and Flutter
        run: |
          dart pub global activate fvm "$FVM_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          cd apps/flutter/app
          "$HOME/.pub-cache/bin/fvm" install --skip-pub-get
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android
      - name: Cache Android V8 build
        uses: actions/cache@v4
        with:
          path: tools/release/work/android-v8
          key: android-v8-${{ runner.os }}-${{ hashFiles('tools/build_scripts/prepare_android_v8.py', 'apps/flutter/native/operit-flutter-bridge/Cargo.lock') }}
          restore-keys: |
            android-v8-${{ runner.os }}-
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build lld python3-venv wget gnupg
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          python3 -m venv .venv
          npm install --global typescript@5.9.3
          corepack enable pnpm
          cd plugins/packages/buildin/workflow
          corepack pnpm install --frozen-lockfile
      - name: Prepare temporary Android signing
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/operit-debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > apps/flutter/app/android/local.properties <<EOF
          flutter.sdk=$(cd apps/flutter/app/.fvm/flutter_sdk && pwd)
          RELEASE_STORE_FILE=$RUNNER_TEMP/operit-debug.keystore
          RELEASE_STORE_PASSWORD=android
          RELEASE_KEY_ALIAS=androiddebugkey
          RELEASE_KEY_PASSWORD=android
          EOF
      - name: Build debug-signed release APK
        run: |
          mkdir -p tools/release/secrets
          cat > tools/release/secrets/android-signing.properties <<EOF
          RELEASE_STORE_FILE=$RUNNER_TEMP/operit-debug.keystore
          RELEASE_STORE_PASSWORD=android
          RELEASE_KEY_ALIAS=androiddebugkey
          RELEASE_KEY_PASSWORD=android
          EOF
          python3 tools/build_scripts/build_flutter_android.py --build-name 2.0.0 --build-number 41
      - uses: actions/upload-artifact@v4
        with:
          name: operit2-installable-apk
          path: tools/release/dist/*.apk
          if-no-files-found: error
          retention-days: 3
